[package]
name = "maomi-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
alacritty_terminal.workspace = true
portable-pty.workspace = true
async-channel.workspace = true
which.workspace = true
sysinfo.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Thread and process priorities, process liveness (src/priority.rs, src/process.rs: the only
# unsafe code here).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

# src/priority.rs and src/process.rs allow unsafe for themselves; the rest of the crate keeps
# the workspace's deny.
[lints]
workspace = true
