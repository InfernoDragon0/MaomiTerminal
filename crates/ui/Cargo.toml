[package]
name = "maomi-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
# Kitty graphics frames for GPUI's RenderImage (same crate version gpui uses).
image.workspace = true
maomi-term.workspace = true
maomi-config.workspace = true
maomi-vault.workspace = true
maomi-ssh.workspace = true
maomi-workbench.workspace = true
maomi-git.workspace = true
# Git paths are raw bytes (maomi-git's status and ops take BString).
bstr = "1.13"
zeroize = "1"
async-channel.workspace = true
anyhow.workspace = true
sysinfo.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# Diff syntax colours: syntect with two-face's extended grammar set (~200 languages, MIT).
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy", "default-syntaxes"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(windows)'.dependencies]
# Pinning a standalone window on top (src/window_ext.rs, the only unsafe code here).
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
