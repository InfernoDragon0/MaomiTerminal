name: Release

# Push a tag `vX.Y.Z` matching the workspace version in Cargo.toml. Each OS builds, packs its
# Velopack channel (win / osx / linux) and uploads it straight to one GitHub release, which is also
# the feed the in-app updater reads. No workflow artifacts, so nothing counts against Actions storage.
# Actions are pinned to full commit SHAs like ci.yml; the trailing comment names the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep in step with the `velopack` crate version in Cargo.toml.
  VPK_VERSION: 1.2.161
  PACK_ID: MaomiTerminal
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    name: release (${{ matrix.channel }})
    strategy:
      # One failed OS should not stop the others from shipping their channel.
      fail-fast: false
      matrix:
        include:
          # vpk assumes x86 on Windows unless --runtime says otherwise.
          - { os: windows-latest, channel: win, exe: maomiterminal.exe, runtime: win-x64 }
          # 22.04 so the AppImage runs on older glibc too.
          - { os: ubuntu-22.04, channel: linux, exe: maomiterminal, runtime: linux-x64 }
          # Universal binary: no single architecture to name.
          - { os: macos-latest, channel: osx, exe: maomiterminal, runtime: "" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from Cargo.toml must match the tag
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Before the build: once the first OS uploads, "latest release" is the new one, and the
      # delta must be built against the previous version.
      - name: Previous release (delta base)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          vpk download github --repoUrl "$REPO_URL" --token "$GITHUB_TOKEN" -o Releases || true
      - name: "Linux system libraries (GPUI: X11, Wayland, Vulkan, fonts)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig-dev \
            libfreetype-dev libasound2-dev libssl-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-about

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release --locked -p maomi-app
          mkdir publish
          cp "target/release/${{ matrix.exe }}" publish/
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p maomi-app --target aarch64-apple-darwin
          cargo build --release --locked -p maomi-app --target x86_64-apple-darwin
          mkdir publish
          lipo -create -output publish/maomiterminal \
            target/aarch64-apple-darwin/release/maomiterminal \
            target/x86_64-apple-darwin/release/maomiterminal

      - name: Licences
        shell: bash
        run: |
          cargo about generate about.hbs -o publish/THIRD-PARTY.md
          cp LICENSE NOTICE publish/

      - name: Pack
        shell: bash
        run: |
          extra=()
          if [ -n "${{ matrix.runtime }}" ]; then
            extra+=(--runtime "${{ matrix.runtime }}")
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra+=(--bundleId io.github.infernodragon0.maomiterminal)
          fi
          vpk pack -u "$PACK_ID" -v "${{ steps.version.outputs.version }}" -p publish \
            --mainExe "${{ matrix.exe }}" --packTitle MaomiTerminal --packAuthors maomi \
            -o Releases "${extra[@]}"

      # The first OS to finish creates the release and the others merge into it. Retried in case
      # two jobs try to create it at the same moment.
      - name: Upload to GitHub Releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            vpk upload github -o Releases --channel "${{ matrix.channel }}" \
              --repoUrl "$REPO_URL" --token "$GITHUB_TOKEN" \
              --tag "$GITHUB_REF_NAME" --releaseName "MaomiTerminal $GITHUB_REF_NAME" \
              --publish --merge && exit 0
            echo "upload attempt $attempt failed, retrying"
            sleep $((attempt * 30))
          done
          exit 1
